name: Validate package

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "docs/candidates/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out package
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
          npm ci

      - name: Check JavaScript syntax and tests
        run: |
          for file in tools/*.js tools/lib/*.js tests/*.js; do node --check "$file"; done
          npm test

      - name: Check Lua syntax and resolver behavior
        run: |
          luac5.1 -p Module.lua Hybrid.lua QuestIDResolver.lua generated/*.lua
          lua5.1 tests/quest_resolver.lua

      - name: Validate installed audio inventory
        run: |
          python3 CheckAudio.py
          git diff --exit-code -- generated/installed_audio.lua

      - name: Validate complete package
        run: npm run validate
